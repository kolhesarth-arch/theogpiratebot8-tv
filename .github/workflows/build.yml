name: Build Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Clean TV APK
        run: |
          mkdir -p gradle/wrapper
          echo 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.0.2-bin.zip' > gradle/wrapper/gradle-wrapper.properties

          cat << 'EOF' > settings.gradle
          rootProject.name = "TheOGPirateBot"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.1.1' }
          }
          allprojects {
              repositories { google(); mavenCentral() }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.tvapp'
              compileSdk 33
              defaultConfig {
                  applicationId "com.example.tvapp"
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload Clean TV APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-TV-APK
          path: app/build/outputs/apk/debug/app-debug.apk
